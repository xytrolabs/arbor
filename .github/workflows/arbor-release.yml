#
# Arbor release: build portable binaries for every supported OS/arch and
# publish them to a GitHub Release.
#
# Trigger: push a tag like `v1.0.0` (or run manually).
#
# Asset naming (what install.sh expects):
#   arbor-<version>-<target>.tar.gz    (linux/macos)
#   arbor-<version>-<target>.zip       (windows)
#
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux: musl = fully static, runs on any distro -------------
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            archive: tar.gz
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-22.04
            archive: tar.gz
          # glibc builds for users who want the distro's dynamic linking
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          # ---- macOS ------------------------------------------------------
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # ---- Windows ----------------------------------------------------
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # --- Cross-compilation toolchains (Linux) ----------------------------
      - name: Install musl tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross linkers (aarch64/armv7)
        if: matrix.target == 'aarch64-unknown-linux-musl' || matrix.target == 'armv7-unknown-linux-musleabihf'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            curl -fsSL https://musl.cc/aarch64-linux-musl-cross.tgz | tar -xz -C "$HOME"
            echo "$HOME/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH
          else
            curl -fsSL https://musl.cc/armv7l-linux-musleabihf-cross.tgz | tar -xz -C "$HOME"
            echo "$HOME/armv7l-linux-musleabihf-cross/bin" >> $GITHUB_PATH
          fi

      - name: Install cross linkers (aarch64 gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> $GITHUB_ENV

      - name: Configure musl static linking
        if: contains(matrix.target, 'musl')
        run: |
          # Write linker/compiler overrides to $GITHUB_ENV so they persist into
          # the build step (plain `export` would not cross step boundaries).
          case "${{ matrix.target }}" in
            x86_64-*)
              echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> $GITHUB_ENV
              ;;
            aarch64-*)
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc" >> $GITHUB_ENV
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C target-feature=+crt-static" >> $GITHUB_ENV
              echo "CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc" >> $GITHUB_ENV
              # Crates with C sources (ring) also need the matching archiver;
              # the host `ar` writes x86 objects into an ARM archive.
              echo "AR_aarch64_unknown_linux_musl=aarch64-linux-musl-ar" >> $GITHUB_ENV
              ;;
            armv7-*)
              echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER=armv7l-linux-musleabihf-gcc" >> $GITHUB_ENV
              echo "CC_armv7_unknown_linux_musleabihf=armv7l-linux-musleabihf-gcc" >> $GITHUB_ENV
              echo "AR_armv7_unknown_linux_musleabihf=armv7l-linux-musleabihf-ar" >> $GITHUB_ENV
              ;;
          esac

      # --- Build -----------------------------------------------------------
      # arbor-test-support is a workspace dev crate; excluding it trims the build.
      - name: Build
        run: cargo build --release --locked --workspace --exclude arbor-test-support --target ${{ matrix.target }}

      # --- Package ---------------------------------------------------------
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$VERSION" ] || VERSION="manual"
          STEM="arbor-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$STEM/share/arbor" "dist/$STEM/docs"
          cp "target/${{ matrix.target }}/release/arbor" "dist/$STEM/"
          # The installer reads share/arbor/arbor.ind and docs/ relative to the
          # extracted binary, so these must keep that layout. Putting arbor.ind
          # at the archive root silently installs a shell with no helper
          # library.
          if [ -f share/arbor/arbor.ind ]; then
            cp share/arbor/arbor.ind "dist/$STEM/share/arbor/"
          fi
          if [ -d docs ]; then
            cp docs/*.md "dist/$STEM/docs/" 2>/dev/null || true
          fi
          cp NOTICE "dist/$STEM/" 2>/dev/null || true
          cp LICENSE "dist/$STEM/" 2>/dev/null || true
          cp README.md "dist/$STEM/" 2>/dev/null || true
          tar -czf "dist/$STEM.tar.gz" -C dist "$STEM"
          # Stable, version-less alias: the installer falls back to this name
          # when it cannot ask the API for the latest tag (rate limits, offline,
          # or a mirror).
          cp "dist/$STEM.tar.gz" "dist/arbor-${{ matrix.target }}.tar.gz"
          echo "ASSETS=dist/$STEM.tar.gz dist/arbor-${{ matrix.target }}.tar.gz" >> $GITHUB_ENV

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME -replace '^v', ''
          if (-not $Version) { $Version = 'manual' }
          $Stem = "arbor-$Version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$Stem/share/arbor" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist/$Stem/docs" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/arbor.exe" "dist/$Stem/"
          if (Test-Path "share/arbor/arbor.ind") { Copy-Item "share/arbor/arbor.ind" "dist/$Stem/share/arbor/" }
          if (Test-Path "docs") { Get-ChildItem "docs/*.md" | Copy-Item -Destination "dist/$Stem/docs/" }
          if (Test-Path "NOTICE") { Copy-Item "NOTICE" "dist/$Stem/" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "dist/$Stem/" }
          Compress-Archive -Path "dist/$Stem" -DestinationPath "dist/$Stem.zip"
          Copy-Item "dist/$Stem.zip" "dist/arbor-${{ matrix.target }}.zip"
          "ASSETS=dist/$Stem.zip dist/arbor-${{ matrix.target }}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generate checksum
        run: |
          cd dist
          for f in $ASSETS; do
            FILE=$(basename "$f")
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$FILE" > "$FILE.sha256"
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$FILE" > "$FILE.sha256"
            elif command -v openssl >/dev/null 2>&1; then
              # macOS and the Windows runner's bash have neither sha256sum nor
              # shasum in some images; openssl is the common denominator.
              printf '%s  %s\n' "$(openssl dgst -sha256 "$FILE" | awk '{print $NF}')" "$FILE" > "$FILE.sha256"
            else
              echo "no sha256 tool available (sha256sum, shasum, openssl)" >&2
              exit 1
            fi
            cat "$FILE.sha256"
          done

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          # Published, not draft: the installer's GitHub fallback downloads
          # `releases/latest/download/...`, which 404s while a release is a
          # draft.
          draft: false
          generate_release_notes: true

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: arbor-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
