# Arbor CI.
#
# Deliberately small. The inherited Nushell workflows targeted self-hosted
# runners that do not exist for this repository (jobs stayed queued forever) and
# covered a matrix Arbor does not ship. This covers what actually matters:
#
#   * the shell builds on all three desktop platforms,
#   * its test suite passes on Linux,
#   * clippy is reported without blocking (a fresh fork is not warning-clean yet).
#
# Release artefacts are built separately by `arbor-release.yml`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Building the shipped binary on every platform is what caught the
    # Unix-only APIs that broke Windows. Keep it.
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The repo pins 1.97.1 in rust-toolchain.toml, which overrides the action
      # above; `--locked` keeps the build reproducible from Cargo.lock.
      - name: Build arbor
        run: cargo build --locked --bin arbor

  test:
    name: test (linux)
    runs-on: ubuntu-latest
    # The suite is not fast, but it is not unbounded either. If it ever needs
    # more than this, something is hanging rather than being slow.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: |
          # Arbor's own crates, not all 46 inherited ones: building a test harness
          # for every crate in the workspace takes longer than this job's budget on
          # a hosted runner. These are the crates Arbor owns and changes.
          #
          # `--lib --bins` avoids integration tests, several of which use
          # `#[deps(NU_PLUGIN_*)]` and only compile with upstream's `toolkit.nu`
          # plugin harness.
          #
          # `--skip` drops a test that hangs on the unmodified upstream tree too, so
          # it is not an Arbor regression.
          cargo test --locked \
            -p arbor -p arbor-system -p arbor-protocol -p arbor-parser \
            -p arbor-config -p arbor-cmd-lang \
            --lib --bins \
            -- --skip external_command_trailing_newline

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    # Reported, not enforced: a fork that has renamed every crate does not start
    # out warning-clean, and a permanently red check trains people to ignore it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        # Same target selection as the test job: `--all-targets` would pull in the
        # plugin integration tests, which cannot compile here.
        run: cargo clippy --locked --workspace --exclude arbor-test-support --lib --bins
