[package]
authors.workspace = true
description = "CLI-related functionality for Nushell"
repository = "https://github.com/nushell/nushell/tree/main/crates/arbor-cli"
edition.workspace = true
license.workspace = true
name = "arbor-cli"
rust-version.workspace = true
version.workspace = true
autotests = false

[lib]
bench = false
harness = false

[[test]]
name = "tests"
path = "tests/main.rs"
harness = false

[dev-dependencies]
arbor-cmd-lang = { workspace = true, features = ["os"] }
arbor-command = { workspace = true, features = ["os"] }
arbor-std.workspace = true
arbor-test-support = { path = "../arbor-test-support", features = ["os"] }
rstest = { workspace = true, default-features = false }
tempfile = { workspace = true }

[dependencies]
arbor-cmd-base.workspace = true
arbor-command = { workspace = true, features = ["os"] }
arbor-engine = { workspace = true, features = ["os"] }
arbor-glob.workspace = true
arbor-path.workspace = true
arbor-parser.workspace = true
arbor-plugin-engine = { workspace = true, optional = true }
arbor-protocol = { workspace = true, features = ["os"] }
arbor-config.workspace = true
arbor-utils.workspace = true
arbor-color-config.workspace = true
arbor-experimental.workspace = true
nu-ansi-term.workspace = true
reedline = { workspace = true, features = ["bashisms"] }

chrono = { default-features = false, features = ["std"], workspace = true }
crossterm = { workspace = true }
fancy-regex = { workspace = true }
is_executable = { workspace = true }
log = { workspace = true }
lru = { workspace = true }
lscolors = { workspace = true, default-features = false, features = ["nu-ansi-term"] }
miette = { workspace = true, features = ["fancy-no-backtrace"] }
nucleo-matcher = { workspace = true }
parking_lot = { workspace = true }
percent-encoding = { workspace = true }
sysinfo = { workspace = true }
strum = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
which = { workspace = true }

[features]
plugin = ["arbor-plugin-engine"]
system-clipboard = ["reedline/system_clipboard"]
sqlite = ["reedline/sqlite", "arbor-protocol/sqlite", "arbor-command/sqlite"]

[lints]
workspace = true
