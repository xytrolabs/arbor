[package]
authors.workspace = true
description = "Nushell's parser"
repository = "https://github.com/nushell/nushell/tree/main/crates/arbor-parser"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
name = "arbor-parser"
version.workspace = true
exclude = ["/fuzz"]

[lib]
bench = false

[lints]
workspace = true

[dependencies]
arbor-engine.workspace = true
arbor-path.workspace = true
arbor-plugin-engine = { workspace = true, optional = true }
arbor-protocol.workspace = true
arbor-utils.workspace = true
arbor-experimental.workspace = true

chrono = { default-features = false, features = ['std'], workspace = true }
itertools = { workspace = true }
log = { workspace = true }
memchr = { workspace = true }
rustc-hash = { workspace = true }
semver = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rstest = { workspace = true, default-features = false }

[features]
plugin = ["arbor-plugin-engine", "arbor-engine/plugin"]
