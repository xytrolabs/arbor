[package]
authors.workspace = true
description = "Color configuration code used by Nushell"
repository = "https://github.com/nushell/nushell/tree/main/crates/arbor-color-config"
edition.workspace = true
license.workspace = true
name = "arbor-color-config"
rust-version.workspace = true
version.workspace = true

[lib]
bench = false
harness = false

[[test]]
name = "tests"
path = "tests/main.rs"
harness = false

[lints]
workspace = true

[dependencies]
arbor-protocol.workspace = true
arbor-engine.workspace = true
arbor-json.workspace = true
nu-ansi-term.workspace = true

serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
arbor-test-support = { path = "../arbor-test-support", features = ["os"] }
