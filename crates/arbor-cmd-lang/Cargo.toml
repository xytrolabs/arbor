[package]
authors.workspace = true
build = "build.rs"
description = "Nushell's core language commands"
repository = "https://github.com/nushell/nushell/tree/main/crates/arbor-cmd-lang"
edition.workspace = true
license.workspace = true
name = "arbor-cmd-lang"
rust-version.workspace = true
version.workspace = true

[lib]
bench = false

[lints]
workspace = true

[dependencies]
arbor-engine.workspace = true
arbor-experimental.workspace = true
arbor-parser.workspace = true
arbor-protocol.workspace = true
arbor-utils.workspace = true
arbor-cmd-base.workspace = true

itertools = { workspace = true }
semver = { workspace = true }
shadow-rs = { version = "2.0", default-features = false }

[build-dependencies]
shadow-rs = { version = "2.0", default-features = false, features = ["build"] }

[dev-dependencies]
arbor-test-support = { path = "../arbor-test-support" }

quickcheck = { workspace = true }
quickcheck_macros = { workspace = true }
miette = { workspace = true }

[features]
default = ["os"]
os = [
  "arbor-engine/os",
  "arbor-protocol/os",
  "arbor-test-support/os",
  "arbor-utils/os",
]
plugin = [
  "arbor-protocol/plugin",
  "os",
]
