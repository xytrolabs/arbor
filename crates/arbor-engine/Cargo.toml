[package]
authors.workspace = true
description = "Nushell's evaluation engine"
repository = "https://github.com/nushell/nushell/tree/main/crates/arbor-engine"
edition.workspace = true
license.workspace = true
name = "arbor-engine"
rust-version.workspace = true
autotests = false
version.workspace = true

[lib]
bench = false
harness = false

[lints]
workspace = true

[dependencies]
arbor-protocol.workspace = true
arbor-experimental.workspace = true
arbor-path.workspace = true
arbor-glob.workspace = true
arbor-utils.workspace = true
fancy-regex = { workspace = true }
log = { workspace = true }

[features]
default = ["os"]
os = [
  "arbor-protocol/os",
  "arbor-test-support/os",
  "arbor-utils/os",
]
plugin = [
  "arbor-protocol/plugin",
  "os",
]

[dev-dependencies]
arbor-test-support = { path = "../arbor-test-support" }
rstest.workspace = true
