[package]
name = "arbor-plugin-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Testing support for Nushell plugins"
repository = "https://github.com/nushell/nushell/tree/main/crates/arbor-plugin-test-support"

[lib]
bench = false

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["local-socket"]
local-socket = ["arbor-plugin/local-socket", "arbor-plugin-engine/local-socket"]

[dependencies]
arbor-engine = { workspace = true, features = ["plugin"] }
arbor-protocol = { workspace = true, features = ["plugin"] }
arbor-parser = { workspace = true, features = ["plugin"] }
arbor-plugin.workspace = true
arbor-plugin-core.workspace = true
arbor-plugin-engine.workspace = true
arbor-plugin-protocol.workspace = true
arbor-cmd-lang = { workspace = true, features = ["plugin"] }
nu-ansi-term.workspace = true
similar = "3.1"

[dev-dependencies]
typetag = "0.2"
serde = "1.0"
